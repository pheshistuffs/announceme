name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk AnnounceMe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AnnounceMe-android
          path: AnnounceMe.apk

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build exe
        run: >
          dotnet publish src/AnnounceMe.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o dist
      - run: cd dist && zip -9 ../AnnounceMe-windows.zip AnnounceMe.exe
      - uses: actions/upload-artifact@v4
        with:
          name: AnnounceMe-windows
          path: AnnounceMe-windows.zip

  release:
    if: github.event_name != 'pull_request'
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AnnounceMe, сборка ${{ github.run_number }}
          body: |
            Android: скачайте AnnounceMe.apk на телефон и откройте его.
            Windows: распакуйте AnnounceMe-windows.zip и запустите AnnounceMe.exe.
          files: |
            AnnounceMe.apk
            AnnounceMe-windows.zip
